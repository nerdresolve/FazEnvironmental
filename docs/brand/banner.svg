<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="FAZ Environmental &amp; Emergency Consulting">
  <title>FAZ Environmental &amp; Emergency Consulting</title>

  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050d1c"/>
      <stop offset="55%" stop-color="#0a1930"/>
      <stop offset="100%" stop-color="#16304f"/>
    </linearGradient>

    <linearGradient id="onda" x1="0" y1="0.1" x2="1" y2="0.9">
      <stop offset="0" stop-color="#b3e17e"/>
      <stop offset="0.5" stop-color="#96d456"/>
      <stop offset="1" stop-color="#7ec13f"/>
    </linearGradient>

    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="55%" stop-color="#7ec13f" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#7ec13f" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vinheta" cx="0.5" cy="0.4" r="0.8">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>

    <clipPath id="moldura"><rect width="1280" height="400" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#moldura)">
    <rect width="1280" height="400" fill="url(#fundo)"/>

    <!-- Grade de coordenadas: prontidão operacional, leitura de risco. -->
    <g stroke="#7ec13f" stroke-opacity="0.08">
      <line x1="0" y1="80" x2="1280" y2="80"/>
      <line x1="0" y1="160" x2="1280" y2="160"/>
      <line x1="0" y1="240" x2="1280" y2="240"/>
      <line x1="0" y1="320" x2="1280" y2="320"/>
      <line x1="160" y1="0" x2="160" y2="400"/>
      <line x1="320" y1="0" x2="320" y2="400"/>
      <line x1="480" y1="0" x2="480" y2="400"/>
    </g>

    <!-- Onda de contenção: a curva que assina a marca FAZ. -->
    <g fill="none" opacity="0.5">
      <path d="M-40 300 C 220 258, 470 332, 720 288 S 1120 232, 1330 276"
            stroke="#7ec13f" stroke-opacity="0.3" stroke-width="2.5"/>
      <path d="M-40 330 C 240 288, 500 358, 750 314 S 1140 262, 1330 304"
            stroke="#b3e17e" stroke-opacity="0.16" stroke-width="2"/>
    </g>
    <g fill="#7ec13f" opacity="0.3">
      <circle cx="180" cy="286" r="4"/><circle cx="420" cy="308" r="4"/>
      <circle cx="660" cy="298" r="4"/><circle cx="900" cy="262" r="4"/>
      <circle cx="1140" cy="258" r="4"/>
    </g>

    <circle cx="1050" cy="120" r="240" fill="url(#halo)"/>

    <!-- Marca: F A Z como monograma técnico, disco + onda dupla. -->
    <g transform="translate(120,200)">
      <circle r="86" fill="none" stroke="#7ec13f" stroke-opacity="0.35" stroke-width="1.5"/>
      <circle r="70" fill="#0a1930"/>
      <path d="M-52 14 C -30 -6, -8 26, 14 4 S 52 -14, 62 8"
            fill="none" stroke="#3f7a1e" stroke-width="9" stroke-linecap="round" opacity="0.85"/>
      <path d="M-58 -6 C -34 -28, -6 4, 20 -18 S 56 -34, 66 -12"
            fill="none" stroke="url(#onda)" stroke-width="9" stroke-linecap="round"/>
      <text x="0" y="8" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
            font-weight="800" font-size="34" fill="#ffffff" letter-spacing="1">FAZ</text>
    </g>

    <g font-family="Arial, Helvetica, sans-serif">
      <text x="260" y="176" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="0.3">
        FAZ Environmental
      </text>
      <text x="260" y="222" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="0.3">
        &amp; <tspan fill="#96d456">Emergency Consulting</tspan>
      </text>
      <text x="260" y="260" font-size="19" fill="#cbd2da" letter-spacing="0.2">
        Consultoria ambiental, capacitação técnica e prontidão operacional
      </text>
      <text x="260" y="286" font-size="19" fill="#cbd2da" letter-spacing="0.2">
        para organizações que não podem improvisar diante de uma emergência.
      </text>
    </g>

    <rect width="1280" height="400" fill="url(#vinheta)"/>
  </g>
</svg>
